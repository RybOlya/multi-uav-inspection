name: swarm-iot

# Default: MQTT broker only (enough to fly drones or run mock_swarm).
#   make up
#
# Full observability stack (InfluxDB + Telegraf + Grafana):
#   make up-full

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: swarm-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./cloud/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  influxdb:
    profiles: [observability]
    image: influxdb:2.7
    container_name: swarm-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: swarmadmin
      DOCKER_INFLUXDB_INIT_ORG: swarm
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_RETENTION: 7d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: swarm-admin-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2

  telegraf:
    profiles: [observability]
    image: telegraf:1.30
    container_name: swarm-telegraf
    restart: unless-stopped
    depends_on:
      - mosquitto
      - influxdb
    environment:
      INFLUX_TOKEN: swarm-admin-token
    volumes:
      - ./cloud/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    profiles: [observability]
    image: grafana/grafana:10.4.2
    container_name: swarm-grafana
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./cloud/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./cloud/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mosquitto-data:
  mosquitto-log:
  influxdb-data:
  influxdb-config:
  grafana-data:
