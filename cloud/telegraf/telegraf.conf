# Telegraf — pulls swarm telemetry off Mosquitto and writes it to InfluxDB v2.
#
# Three input plugins, one per topic family from swarm/mqtt_publisher.py:
#   - swarm/telemetry/+   InfluxDB Line Protocol (controller publishes it directly).
#   - swarm/state/+       JSON {drone_id, mode, position[3], velocity[3], yaw, ...}
#   - swarm/events/+      JSON {drone_id, ...} for lifecycle / accept / reject.
#
# All three land in the InfluxDB "telemetry" bucket as separate measurements.

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  flush_interval = "5s"
  flush_jitter = "0s"
  precision = "1ms"
  hostname = "telegraf"
  omit_hostname = false


# -------- 1. High-frequency telemetry: ALREADY in Influx Line Protocol --------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["swarm/telemetry/+"]
  qos = 0
  client_id = "telegraf-telemetry"
  data_format = "influx"


# -------- 2. Per-drone state messages (5 Hz, JSON) ----------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["swarm/state/+"]
  qos = 0
  client_id = "telegraf-state"
  data_format = "json_v2"
  name_override = "drone_state"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "drone_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "mode"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "position.0"
      rename = "x"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "position.1"
      rename = "y"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "position.2"
      rename = "z"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "velocity.0"
      rename = "vx"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "velocity.1"
      rename = "vy"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "velocity.2"
      rename = "vz"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "yaw"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "trajectory_elapsed_s"
      rename = "elapsed_s"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "trajectory_total_s"
      rename = "total_s"
      type = "float"
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "trajectory_finished"
      rename = "finished"
      type = "bool"


# -------- 3. Lifecycle events (sparse, JSON) ----------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["swarm/events/+"]
  qos = 1
  client_id = "telegraf-events"
  data_format = "json_v2"
  name_override = "drone_event"

  [[inputs.mqtt_consumer.json_v2]]
    timestamp_path = "ts"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "drone_id"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "cmd"
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "previous_mode"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "seq"
      type = "int"
      optional = true
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "reason"
      type = "string"
      optional = true


[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "swarm"
  bucket = "telemetry"
